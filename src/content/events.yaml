- id: ludocow-analysis
  date: 2026-09-30
  kind: press
  title: "The first explainers"
  text: "YouTuber LudocowTV's analysis of what the mashups mean for the industry passes 150,000 views in a week, as commentary channels start covering the trend."
  sources:
    - { title: "AI Video Game Merging", publisher: "Know Your Meme", url: "https://knowyourmeme.com/memes/cultures/ai-video-game-merging" }

- id: halo-browser
  date: 2026-09-30
  kind: port
  title: "Halo: Combat Evolved runs in a browser"
  text: "Mitchell Hynes puts the original Xbox Halo in a browser tab, with the campaign, split-screen co-op and 128-player online rooms, built on a community decompilation. It's not a mashup, but it showed the same week how far AI-assisted ports had come, and that a browser could host them."
  who: [{ name: Mitchell Hynes }]
  links: [{ label: "OpenCommunityEdition/OpenCE", url: "https://github.com/OpenCommunityEdition/OpenCE" }]
  sources:
    - { title: "You can now play Halo: Combat Evolved in a web browser, and it even has multiplayer", publisher: "PC Gamer", url: "https://www.pcgamer.com/hardware/you-can-now-play-halo-combat-evolved-in-a-web-browser-and-it-even-has-multiplayer/" }
