# Everything on the /history/ timeline that isn't a mashup entry (those come from
# src/content/mashups/ automatically). Dates are first public appearance, in UTC.
# X post dates are decoded from the post ID. Every entry needs a link or a source.

- id: benilla
  date: 2026-07-24
  kind: engine
  title: "benilla, a World of Warcraft client rewritten in Rust"
  text: "A complete World of Warcraft 1.12.1 client, written from scratch in Rust on Bevy and loading data from your own install. It was an early sign that AI-assisted full-engine rewrites had become practical."
  who: [{ name: samwhosung, url: "https://github.com/samwhosung" }]
  links: [{ label: "samwhosung/benilla", url: "https://github.com/samwhosung/benilla" }]

- id: nexus-ai-tags
  date: 2026-07-30
  kind: platform
  title: "Nexus Mods expands its AI disclosure tags"
  text: "Two months before the wave, the largest mod host split its generative-AI tag into three (AI-Generated Content, AI Media and AI Assisted) and said undisclosed AI use could lead to moderation. Its guidance asks modders to avoid AI tools unless they have permission for every asset, which is one reason the mashups never appeared there."
  sources:
    - { title: "Nexus Mods Officially Responds To Complaints About AI Content", publisher: "TheGamer", url: "https://www.thegamer.com/nexus-mods-generative-ai-guidelines-update/" }
    - { title: "Nexus Mods finally tightens the screws on AI", publisher: "PC Gamer", url: "https://www.pcgamer.com/gaming-industry/nexus-mods-finally-tightens-the-screws-on-ai-though-its-still-playing-softball-with-the-tide-of-slop/" }

- id: skate-3-rust-engine
  date: 2026-09-08
  kind: engine
  title: "skate-3-rust-engine is published"
  text: "A Rust/Bevy skating engine built from Skate 3 reverse-engineering research, with game assets loaded from your own copy. It became the most reused engine of the wave, behind the MW2 mashup and every GTA and Bully skate mod."
  who: [{ name: SK8-ENGINE, url: "https://github.com/SK8-ENGINE" }]
  links: [{ label: "SK8-ENGINE/skate-3-rust-engine", url: "https://github.com/SK8-ENGINE/skate-3-rust-engine" }]

- id: iw4l
  date: 2026-09-13
  kind: engine
  title: "IW4L, a Modern Warfare 2 runtime in Rust"
  text: "vladtrc publishes a standalone, experimental Call of Duty runtime in Rust on Bevy and wgpu. Because it and the Skate 3 engine were both Bevy codebases, they could be merged two weeks later."
  who: [{ name: vladtrc, url: "https://github.com/vladtrc" }]
  links: [{ label: "vladtrc/iw4L", url: "https://github.com/vladtrc/iw4L" }]

- id: chasm-skate-rust-clip
  date: 2026-09-19
  kind: clip
  title: "chasm: \"I rewrote Skate 3 in Rust\""
  text: "The earliest known post of the trend. chasm (chasmlol on GitHub) shows Skate 3's skating running in a Rust rewrite, built with what they called a human-and-AI development loop. The post itself showed about 6,000 likes and 137,000 views by 13 October."
  who: [{ name: chasm, url: "https://github.com/chasmlol" }]
  sources:
    - { title: "I rewrote Skate 3 in Rust", publisher: "X (@chasmmmmmmmmmmm)", url: "https://x.com/chasmmmmmmmmmmm/status/2101375411867255131" }
    - { title: "AI Video Game Merging", publisher: "Know Your Meme", url: "https://knowyourmeme.com/memes/cultures/ai-video-game-merging" }

- id: opus-5-5
  date: 2026-09-22
  kind: model
  title: "Claude Opus 5.5 is released"
  text: "Anthropic's new flagship launches at about 40% lower cost than Opus 5 for typical workloads. Nearly every mashup of the next two weeks credits it. Cheaper long agent sessions made it affordable to point a model at a game's compiled code for hours."
  sources:
    - { title: "Anthropic Releases Claude Opus 5.5 With Lower Pricing and New Safeguards", publisher: "Unite.AI", url: "https://www.unite.ai/anthropic-releases-claude-opus-5-5-with-lower-pricing-and-new-safeguards/" }

- id: banjo-tooie-recomp
  date: 2026-09-28
  kind: port
  title: "An AI-generated Banjo-Tooie PC port appears"
  text: "A native Windows recompilation of Banjo-Tooie whose README says AI tools generated substantial portions of the code. Within a week it was at the centre of the \"slopcomp\" fight (see 5 October)."
  links: [{ label: "some-scurvy-dog/banjo-tooie-scurvy-dog-port", url: "https://github.com/some-scurvy-dog/banjo-tooie-scurvy-dog-port" }]

- id: cod-minecraft-youtube
  date: 2026-09-28
  kind: clip
  title: "Call of Duty × Minecraft hits YouTube"
  text: "A video of Call of Duty merged with Minecraft passes 619,000 views in its first week, the first mashup clip to break out on YouTube."
  sources:
    - { title: "AI Video Game Merging", publisher: "Know Your Meme", url: "https://knowyourmeme.com/memes/cultures/ai-video-game-merging" }

- id: modding-changed-forever
  date: 2026-09-30
  kind: clip
  title: "\"Modding has Changed FOREVER…\""
  text: "chasm's YouTube round-up of the first mashups reaches 2.4 million views in a week. Compilation videos like it spread the clips far beyond X, often without crediting the original makers."
  who: [{ name: chasm, url: "https://github.com/chasmlol" }]
  sources:
