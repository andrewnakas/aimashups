  kind: port
  title: "A wave of single-game Rust rewrites"
  text: "Alongside the crossovers, the chasm Discord filled with AI-assisted Rust and Bevy rewrites of single games that read data from your own copy, the raw material for the next mashups. Among the public ones: Fallout: New Vegas (nv-rs), Mirror's Edge movement (faith-runner), Forza Horizon, Need for Speed: Most Wanted, Assassin's Creed, Counter-Strike: Source, Half-Life 2 (hl2-rs) and White Knuckle's climbing. Most of their commits are co-authored by Claude."
