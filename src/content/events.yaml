- id: faze-scope-mw2-skate
  date: 2026-09-26
  kind: clip
  title: "FaZe Scope: \"New MW2 update in 2026 is crazy\""
  text: "FaZe Scope posts a 17-second clip of a Modern Warfare 2 soldier on Terminal with an on-screen \"SKATE … J: return to MW2\" bar, the skate mode later released in the 2010 Rust Rewrite Mashup. It went up more than a day before chasm's launch post and before any skate-mode code was public, and doesn't say who made the footage. The post itself showed about 2.4 million views and 24,600 likes by 13 October."
  who: [{ name: "FaZe Scope", url: "https://x.com/FaZeScope" }]
  sources:
    - { title: "New MW2 update in 2026 is crazy", publisher: "X (@FaZeScope)", url: "https://x.com/FaZeScope/status/2103913856808673354" }

- id: zomm-claude-code
  date: 2026-09-27
  kind: clip
  title: "\"Claude code hit this community like crack\""
  text: "zom quotes FaZe Scope's MW2 skating clip and credits Claude Code, and replies start asking whether it is a real Skate 3 physics port. The quote post itself showed about 1.1 million views and 21,800 likes by 13 October. chasm's launch post and the repository followed that evening."
  who: [{ name: "zom", url: "https://x.com/zomm" }]
  sources:
    - { title: "claude code hit this community like crack", publisher: "X (@zomm)", url: "https://x.com/zomm/status/2104035647317225598" }

