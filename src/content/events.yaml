  date: 2026-09-29
  kind: press
  title: "Gaming press covers skating in MW2"
  text: "Dexerto, Insider Gaming, Operation Sports and MakeUseOf write up the MW2 skate and Minecraft clips; MakeUseOf identifies the base as IW4L, a Rust rewrite of MW2, with MinecraftOSS for the world. GameSpot and Held Games follow on 30 September, and Held Games reports chasm's clip at 6.7 million views."
