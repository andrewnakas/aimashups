  date: 2026-10-03
  kind: platform
  title: "The Mario in Elden Ring clip is taken down"
  text: "Deltaroo3D's clip of Super Mario 64's Mario in Elden Ring, at 2.9 million views and 60,000 likes, is removed after a copyright claim. The mod's code stays up on GitHub."
