  text: "Within a day of the release, players post their own clips, among them tvllerr's \"Minecraft x Skate 3 x MW2\", LordHeap's \"Skate 3 in MW2 is pure nostalgia\" and KiyyDumb's Minecraft-in-MW2 clip, each showing roughly 470,000 to 590,000 views on the posts by 13 October. LordHeap credited the mod to vtroc7 (IW4L) and chasm."
  who: [{ name: "tvllerr", url: "https://x.com/tvllerr" }, { name: "LordHeap", url: "https://x.com/LordHeap" }, { name: "KiyyDumb", url: "https://x.com/KiyyDumb" }]
