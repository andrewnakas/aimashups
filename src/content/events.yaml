  date: 2026-09-29
  kind: clip
  title: "\"First MW2 x Skate trickshot\""
  text: "codthugger posts the first MW2 skate trickshot clip, and skating in MW2 becomes an X trending topic, \"Modders Add Skateboarding to 2009 Modern Warfare 2\". The trickshot post showed about 429,000 views by 13 October; Kotaku later embedded it."
