- id: ludocow-analysis
  date: 2026-09-30
  kind: press
  title: The first explainers
  text: YouTuber LudocowTV's analysis of what the mashups mean for the industry passes 150,000 views in a week, as commentary channels start covering the trend.
  sources:
    - { title: "AI Video Game Merging", publisher: "Know Your Meme", url: "https://knowyourmeme.com/memes/cultures/ai-video-game-merging" }

- id: halo-browser
  date: 2026-09-30
  kind: port
  title: "Halo: Combat Evolved runs in a browser"
  text: Mitchell Hynes puts the original Xbox Halo in a browser tab, with the campaign, split-screen co-op and 128-player online rooms, built on a community decompilation. It's not a mashup, but it showed the same week how far AI-assisted ports had come, and that a browser could host them.
  who: [{ name: Mitchell Hynes }]
  links: [{ label: "OpenCommunityEdition/OpenCE", url: "https://github.com/OpenCommunityEdition/OpenCE" }]
  sources:
    - { title: "You can now play Halo: Combat Evolved in a web browser, and it even has multiplayer", publisher: "PC Gamer", url: "https://www.pcgamer.com/hardware/you-can-now-play-halo-combat-evolved-in-a-web-browser-and-it-even-has-multiplayer/" }
    - { title: "Free Halo: Combat Evolved browser version adds 128-player multiplayer", publisher: "Generation Amiga", url: "https://www.generationamiga.com/2026/09/30/free-halo-combat-evolved-browser-version-adds-128-player-multiplayer/" }

- id: videocardz
  date: 2026-10-01
  kind: press
  title: Tech press picks it up
  text: VideoCardz runs one of the first news write-ups, collecting the X clips from Minecraft in Elden Ring to Mario Kart in CoD Zombies. TweakTown and others follow within days.
  sources:
    - { title: "Modders are now merging entire games, from Minecraft in Elden Ring to Mario Kart in COD Zombies", publisher: "VideoCardz", url: "https://videocardz.com/newz/modders-are-now-merging-entire-games-from-minecraft-in-elden-ring-to-mario-kart-in-cod-zombies" }
    - { title: "Minecraft runs inside Elden Ring as modders mash up entire games", publisher: "TweakTown", url: "https://www.tweaktown.com/news/113855/minecraft-runs-inside-elden-ring-as-modders-mash-up-entire-games/index.html" }

- id: kotaku-stop
  date: 2026-10-02
  kind: backlash
  title: "Kotaku: \"Modders, please stop\""
  text: Amelia Zollner argues the mashups are made for social feeds, not for playing, and that none of the combined mechanics actually synergize. It was the first major outlet to push back.
  who: [{ name: Amelia Zollner }]
  sources:
    - { title: "Modders, Please Stop Putting Games Inside Other Games With AI", publisher: "Kotaku", url: "https://kotaku.com/i-dont-want-to-play-your-ai-generated-mod-that-puts-skate-3-inside-of-modern-warfare-2-inside-of-minecraft-2000738660" }

- id: mario-clip-removed
  date: 2026-10-03
  kind: platform
  title: The Mario in Elden Ring clip is taken down
  text: Deltaroo3D's clip of Super Mario 64's Mario in Elden Ring, at 2.9 million views and 60,000 likes, is removed after a copyright claim. The mod's code stays up on GitHub.
  mashup: er-mario-mario-in-elden-ring
  who: [{ name: deltarooo, url: "https://github.com/deltarooo" }]
  sources:
    - { title: "AI Video Game Merging", publisher: "Know Your Meme", url: "https://knowyourmeme.com/memes/cultures/ai-video-game-merging" }

- id: vgtimes-real
  date: 2026-10-04
  kind: press
  title: "What's real and what you can download"
  text: VGTimes goes through the viral clips one by one. Only a handful have code behind them (Mario in Elden Ring, SkyCraft, the MW2 skate mashup, the GTA and Bully skate mods). Most of the most-viewed clips have no release, and some no named creator.
  sources:
    - { title: "Minecraft in Elden Ring and TNT in RDR2: The Wild AI Mashups That Broke the Internet", publisher: "VGTimes", url: "https://vgtimes.com/articles/169886-how-ai-game-mashups-work.html" }
    - { title: "Vibe-Coded AI Game Mods: Claude Opus Mashups Flood X", publisher: "Everything Edinburgh", url: "https://everythingedinburgh.com/games/news/vibe-coded-ai-mashup-mods-gaming-twitter/" }

- id: melty
  date: 2026-10-05
  kind: tool
  title: Melty, a launcher for mashups
  text: A free Windows launcher that installs mashups of games you own in one click, with multiplayer lobbies. New mashups are written by coding agents from instructions you paste into Claude Code or Codex. Melty is in Y Combinator's Fall 2026 batch, founded by David Miller. Some viewers questioned whether its demo clips came from other projects.
  who: [{ name: David Miller }]
  links: [{ label: "melty.gg", url: "https://melty.gg/" }]
  sources:
    - { title: "Melty: Mashup any game", publisher: "Y Combinator", url: "https://www.ycombinator.com/companies/melty-gg" }
    - { title: "Melty Game Mashups: How Claude Code Builds Them", publisher: "Developers Digest", url: "https://www.developersdigest.tech/blog/melty-game-mashups-claude-code-2026" }

- id: vgc-backlash
  date: 2026-10-05
  kind: backlash
  title: Modders push back
  text: VGC collects the reaction from established modders. A Kingdom Hearts modder says that if this becomes the permanent state of modding, their current project may be their last. Another calls the click-winning clips "jingling keys". The Banjo-Kazooie PC port lead says their project will never use AI.
  sources:
    - { title: "AI game mashup videos on social media spark debate and backlash among players and modders", publisher: "VGC", url: "https://www.videogameschronicle.com/news/ai-game-mashup-videos-on-social-media-spark-debate-and-backlash-among-players-and-modders/" }
    - { title: "The trend of AI generating mashup mods has angered mod creators", publisher: "GIGAZINE", url: "https://gigazine.net/gsc_news/en/20261005-modders-furious-claude-powered-mashup-mods/" }

- id: slopcomps
  date: 2026-10-05
  kind: backlash
  title: "The \"slopcomp\" fight"
  text: The human teams behind Zelda and Banjo Recompiled disown the AI-generated Banjo-Tooie port, calling vibe-coded recompilations "slopcomps". They say it patches recompiled code from the wrong side, which makes it unmaintainable, and that building on their research by throwing AI at it is disrespectful.
  who: [{ name: DarioSamo }]
  sources:
    - { title: "Zelda and Banjo Recompiled Devs Go To War With AI Vibe-Coded 'Slopcomps'", publisher: "Kotaku", url: "https://kotaku.com/zelda-and-banjo-recompiled-devs-go-to-war-with-ai-vibe-coded-slopcomps-2000739936" }
    - { title: "Zelda and Banjo PC port devs slam new vibe-coded Banjo-Tooie recompilation", publisher: "GamesRadar+", url: "https://www.gamesradar.com/games/platformer/zelda-and-banjo-pc-port-devs-slam-new-vibe-coded-banjo-tooie-recompilation-throwing-ai-at-it-is-just-disrespectful/" }

- id: clean-room-tributes
  date: 2026-10-07
  kind: counter
  title: Clean-room tributes you can play in a browser
  text: Five tributes to the best-known mashups (Blockrealm, Hollow Warden, Night Swing, Kickflip Ops and Block City) go live on this site. They rebuild the mechanics from observation with original code and CC0 assets, so they need no game files and run in a browser tab. Disclosure: this site made them.
  links:
    - { label: "Play the tributes", url: "https://aimashups.com/play/" }
    - { label: "andrewnakas/GameMash", url: "https://github.com/andrewnakas/GameMash" }
